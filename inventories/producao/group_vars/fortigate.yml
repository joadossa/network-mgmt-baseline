---
ansible_connection: ansible.netcommon.httpapi
ansible_network_os: fortinet.fortios.fortios
ansible_httpapi_use_ssl: true
ansible_httpapi_validate_certs: false   # use true com certificado válido
ansible_httpapi_port: 443

fortios_access_token: "{{ vault_fortios_access_token }}"
fortios_vdom: root

# IP do servidor Ansible/AWX COMO O FORTIGATE O VÊ (após NAT, se houver).
# Obrigatório quando a local-in policy está ativa: o preflight aborta se ele
# não estiver dentro de mgmt_networks (proteção anti-lockout).
fortinet_controller_ip: 192.168.100.10

# TACACS+
fortinet_tacacs_name: ISE-TACACS
fortinet_tacacs_group: GRP-TACACS-ADMINS
fortinet_tacacs_admin_name: TACACS-ADMINS
fortinet_tacacs_accprofile: super_admin
fortinet_tacacs_source_ip: ""            # vazio = FortiGate escolhe

# Syslog
fortinet_syslog_facility: local7
fortinet_syslog_severity: information

# ACL de gerência
# Interfaces onde aplicar a local-in policy (definir por host no inventário).
# NÃO use interfaces onde roda SSL-VPN na mesma porta do HTTPS de administração.
fortinet_localin_interfaces: []
fortinet_trusthost_local_admins: []      # ex.: ["admin"]  — revise antes de ativar
