---
# Sanity check SOMENTE LEITURA: ACL de gerência + TACACS+ (Cisco IOS/IOS-XE, NX-OS, Huawei VRP)

- name: "Sanity | carregar regras da plataforma ({{ sanity_platform }})"
  ansible.builtin.include_vars:
    file: "{{ sanity_platform }}.yml"

- name: Sanity | coletar saídas do equipamento
  ansible.netcommon.cli_command:
    command: "{{ item }}"
  loop: "{{ sanity_checks | netbaseline_sources(sanity_config_command) }}"
  register: _sanity_raw
  changed_when: false
  failed_when: false
  check_mode: false

- name: Sanity | avaliar regras
  ansible.builtin.set_fact:
    sanity_results: >-
      {{ _sanity_raw.results | netbaseline_collect_outputs
         | netbaseline_evaluate(sanity_checks, sanity_config_command) }}

- name: Sanity | não conformidades e correção sugerida
  ansible.builtin.debug:
    msg: "{{ sanity_results | netbaseline_host_digest }}"
