---
# Lê, via API, as tabelas que o baseline altera. Usado antes (snapshot) e depois (verificação).
- name: "FGT leitura | consultar configuração ({{ _fgt_phase }})"
  fortinet.fortios.fortios_configuration_fact:
    vdom: "{{ fortios_vdom }}"
    access_token: "{{ fortios_access_token }}"
    selector: "{{ item }}"
  loop: "{{ _fgt_fact_selectors }}"
  register: _fgt_raw
  failed_when: false
  check_mode: false
  no_log: "{{ fortinet_no_log | bool }}"

- name: "FGT leitura | consolidar ({{ _fgt_phase }})"
  ansible.builtin.set_fact:
    _fgt_facts: "{{ _fgt_raw.results | fortios_collect_facts }}"
