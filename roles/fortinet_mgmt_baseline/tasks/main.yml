---
# Baseline de gerência FortiGate (lab): TACACS+ (ISE), Syslog e ACL de gerência.
# Etapas: 1 anti-lockout -> 2 objetos -> 3 TACACS+ -> 4 Syslog -> 5 local-in
# Dica: rode antes com --check --diff para ver o que vai mudar.

- name: "FGT 1 | anti-lockout: o IP do Ansible precisa estar em mgmt_networks"
  ansible.builtin.assert:
    that:
      - fortinet_controller_ip | length > 0
      - fortinet_controller_ip is ansible.utils.in_any_network(mgmt_networks)
    fail_msg: >-
      fortinet_controller_ip ("{{ fortinet_controller_ip }}") vazio ou fora de mgmt_networks.
      A local-in policy bloquearia o seu próprio acesso. Nada foi alterado.
    quiet: true
  when: fortinet_mgmt_acl_enable | bool and fortinet_localin_enable | bool
  tags: [always]

- name: "FGT | preparar redes de gerência (nome do objeto e 'ip máscara')"
  ansible.builtin.set_fact:
    _fgt_addresses: "{{ _fgt_addresses | default([]) + [{'name': _name, 'subnet': _subnet}] }}"
    _fgt_members: "{{ _fgt_members | default([]) + [{'name': _name}] }}"
    _fgt_trusthosts: "{{ _fgt_trusthosts | default({}) | combine({'trusthost' ~ (idx + 1): _subnet}) }}"
  vars:
    _net: "{{ item | ansible.utils.ipaddr('network') }}"
    _name: "{{ fortinet_mgmt_addr_prefix }}{{ _net }}_{{ item | ansible.utils.ipaddr('prefix') }}"
    _subnet: "{{ _net }} {{ item | ansible.utils.ipaddr('netmask') }}"
  loop: "{{ mgmt_networks }}"
  loop_control:
    index_var: idx
  tags: [always]

# --------------------------------------------------------------------- 2
- name: "FGT 2 | objetos de endereço da gerência"
  when: fortinet_mgmt_acl_enable | bool
  tags: [acl]
  block:
    - name: FGT ACL | objeto de endereço por rede de gerência
      fortinet.fortios.fortios_firewall_address:
        vdom: "{{ fortios_vdom }}"
        access_token: "{{ fortios_access_token }}"
        state: present
        firewall_address:
          name: "{{ item.name }}"
          type: ipmask
          subnet: "{{ item.subnet }}"
          comment: "Ansible baseline - rede de gerencia"
      loop: "{{ _fgt_addresses }}"
      loop_control:
        label: "{{ item.name }}"

    - name: FGT ACL | grupo de endereços da gerência
      fortinet.fortios.fortios_firewall_addrgrp:
        vdom: "{{ fortios_vdom }}"
        access_token: "{{ fortios_access_token }}"
        state: present
        firewall_addrgrp:
          name: "{{ fortinet_mgmt_addrgrp }}"
          member: "{{ _fgt_members }}"
          comment: "Ansible baseline - origens autorizadas a gerenciar o FortiGate"

# --------------------------------------------------------------------- 3
- name: "FGT 3 | TACACS+"
  when: fortinet_tacacs_enable | bool
  tags: [tacacs]
  block:
    - name: FGT TACACS+ | servidores TACACS+ (até 3, na ordem de tacacs_servers)
      fortinet.fortios.fortios_user_tacacsplus:
        vdom: "{{ fortios_vdom }}"
        access_token: "{{ fortios_access_token }}"
        state: present
        user_tacacsplus:
          name: "{{ fortinet_tacacs_name }}"
          server: "{{ tacacs_servers[0].ip }}"
          key: "{{ tacacs_key }}"
          secondary_server: "{{ (tacacs_servers[1] | default({})).ip | default(omit) }}"
          secondary_key: "{{ tacacs_key if tacacs_servers | length > 1 else omit }}"
          tertiary_server: "{{ (tacacs_servers[2] | default({})).ip | default(omit) }}"
          tertiary_key: "{{ tacacs_key if tacacs_servers | length > 2 else omit }}"
          port: "{{ fortinet_tacacs_port }}"
          authen_type: "{{ fortinet_tacacs_authen_type }}"
          authorization: "{{ fortinet_tacacs_authorization }}"
          source_ip: "{{ fortinet_tacacs_source_ip | default(omit, true) }}"

    - name: FGT TACACS+ | grupo de usuários remoto
      fortinet.fortios.fortios_user_group:
        vdom: "{{ fortios_vdom }}"
        access_token: "{{ fortios_access_token }}"
        state: present
        user_group:
          name: "{{ fortinet_tacacs_group }}"
          group_type: firewall
          member:
            - name: "{{ fortinet_tacacs_name }}"

    - name: FGT TACACS+ | administrador remoto wildcard (+ trusthosts da gerência)
      fortinet.fortios.fortios_system_admin:
        vdom: "{{ fortios_vdom }}"
        access_token: "{{ fortios_access_token }}"
        state: present
        system_admin: "{{ _fgt_admin | combine(_fgt_trusthosts if _use_trusthost else {}) }}"
      vars:
        _use_trusthost: "{{ fortinet_mgmt_acl_enable | bool and fortinet_trusthost_enable | bool }}"
        _fgt_admin:
          name: "{{ fortinet_tacacs_admin_name }}"
          remote_auth: enable
          wildcard: enable
          remote_group: "{{ fortinet_tacacs_group }}"
          accprofile: "{{ fortinet_tacacs_accprofile }}"
          accprofile_override: "{{ fortinet_tacacs_accprofile_override }}"
          vdom: "{{ fortinet_tacacs_admin_vdoms }}"

    - name: FGT TACACS+ | accounting de comandos administrativos
      fortinet.fortios.fortios_log_tacacsplusaccounting_setting:
        vdom: "{{ fortios_vdom }}"
        access_token: "{{ fortios_access_token }}"
        log_tacacsplusaccounting_setting:
          status: enable
          server: "{{ tacacs_servers[0].ip }}"
          server_key: "{{ tacacs_key }}"
          source_ip: "{{ fortinet_tacacs_source_ip | default(omit, true) }}"
      when: fortinet_tacacs_accounting | bool

# --------------------------------------------------------------------- 4
# O FortiOS tem 4 "slots" de syslog, cada um com módulo próprio: o slot N recebe syslog_servers[N-1].
- name: "FGT 4 | Syslog"
  when: fortinet_syslog_enable | bool
  tags: [syslog]
  block:
    - name: FGT Syslog | servidor 1 (log syslogd setting)
      fortinet.fortios.fortios_log_syslogd_setting:
        vdom: "{{ fortios_vdom }}"
        access_token: "{{ fortios_access_token }}"
        log_syslogd_setting:
          status: enable
          server: "{{ syslog_servers[0].ip }}"
          port: "{{ syslog_servers[0].port | default(514) }}"
          mode: "{{ fortinet_syslog_mode }}"
          facility: "{{ fortinet_syslog_facility }}"
          format: "{{ fortinet_syslog_format }}"
          source_ip: "{{ fortinet_syslog_source_ip | default(omit, true) }}"

    - name: FGT Syslog | servidor 1 severidade
      fortinet.fortios.fortios_log_syslogd_filter:
        vdom: "{{ fortios_vdom }}"
        access_token: "{{ fortios_access_token }}"
        log_syslogd_filter:
          severity: "{{ fortinet_syslog_severity }}"

    - name: FGT Syslog | servidor 2 (log syslogd2 setting)
      fortinet.fortios.fortios_log_syslogd2_setting:
        vdom: "{{ fortios_vdom }}"
        access_token: "{{ fortios_access_token }}"
        log_syslogd2_setting:
          status: enable
          server: "{{ syslog_servers[1].ip }}"
          port: "{{ syslog_servers[1].port | default(514) }}"
          mode: "{{ fortinet_syslog_mode }}"
          facility: "{{ fortinet_syslog_facility }}"
          format: "{{ fortinet_syslog_format }}"
          source_ip: "{{ fortinet_syslog_source_ip | default(omit, true) }}"
      when: syslog_servers | length >= 2

    - name: FGT Syslog | servidor 2 severidade
      fortinet.fortios.fortios_log_syslogd2_filter:
        vdom: "{{ fortios_vdom }}"
        access_token: "{{ fortios_access_token }}"
        log_syslogd2_filter:
          severity: "{{ fortinet_syslog_severity }}"
      when: syslog_servers | length >= 2

    - name: FGT Syslog | servidor 3 (log syslogd3 setting)
      fortinet.fortios.fortios_log_syslogd3_setting:
        vdom: "{{ fortios_vdom }}"
        access_token: "{{ fortios_access_token }}"
        log_syslogd3_setting:
          status: enable
          server: "{{ syslog_servers[2].ip }}"
          port: "{{ syslog_servers[2].port | default(514) }}"
          mode: "{{ fortinet_syslog_mode }}"
          facility: "{{ fortinet_syslog_facility }}"
          format: "{{ fortinet_syslog_format }}"
          source_ip: "{{ fortinet_syslog_source_ip | default(omit, true) }}"
      when: syslog_servers | length >= 3

    - name: FGT Syslog | servidor 3 severidade
      fortinet.fortios.fortios_log_syslogd3_filter:
        vdom: "{{ fortios_vdom }}"
        access_token: "{{ fortios_access_token }}"
        log_syslogd3_filter:
          severity: "{{ fortinet_syslog_severity }}"
      when: syslog_servers | length >= 3

    - name: FGT Syslog | servidor 4 (log syslogd4 setting)
      fortinet.fortios.fortios_log_syslogd4_setting:
        vdom: "{{ fortios_vdom }}"
        access_token: "{{ fortios_access_token }}"
        log_syslogd4_setting:
          status: enable
          server: "{{ syslog_servers[3].ip }}"
          port: "{{ syslog_servers[3].port | default(514) }}"
          mode: "{{ fortinet_syslog_mode }}"
          facility: "{{ fortinet_syslog_facility }}"
          format: "{{ fortinet_syslog_format }}"
          source_ip: "{{ fortinet_syslog_source_ip | default(omit, true) }}"
      when: syslog_servers | length >= 4

    - name: FGT Syslog | servidor 4 severidade
      fortinet.fortios.fortios_log_syslogd4_filter:
        vdom: "{{ fortios_vdom }}"
        access_token: "{{ fortios_access_token }}"
        log_syslogd4_filter:
          severity: "{{ fortinet_syslog_severity }}"
      when: syslog_servers | length >= 4

# --------------------------------------------------------------------- 5
# Por interface: accept das redes de gerência (id base) + deny do resto (id base+1).
- name: "FGT 5 | local-in policy (etapa mais sensível, por último)"
  fortinet.fortios.fortios_firewall_local_in_policy:
    vdom: "{{ fortios_vdom }}"
    access_token: "{{ fortios_access_token }}"
    state: present
    firewall_local_in_policy:
      policyid: "{{ (fortinet_localin_policyid_base | int) + idx }}"
      intf: "{{ item.0 if fortinet_localin_intf_format == 'string' else omit }}"
      intf_dict: "{{ [{'name': item.0}] if fortinet_localin_intf_format == 'list' else omit }}"
      srcaddr:
        - name: "{{ fortinet_mgmt_addrgrp if item.1 == 'accept' else 'all' }}"
      dstaddr:
        - name: all
      action: "{{ item.1 }}"
      service: "{{ fortinet_localin_services }}"
      schedule: always
      status: enable
      comments: "Ansible: {{ 'permite redes de gerencia' if item.1 == 'accept' else 'bloqueia demais origens' }}"
  loop: "{{ fortinet_localin_interfaces | product(['accept', 'deny']) | list }}"
  loop_control:
    index_var: idx
    label: "{{ (fortinet_localin_policyid_base | int) + idx }} {{ item.1 }} {{ item.0 }}"
  when: fortinet_mgmt_acl_enable | bool and fortinet_localin_enable | bool
  tags: [acl]
