[defaults]
inventory              = inventories/producao/hosts.yml
roles_path             = roles
filter_plugins         = filter_plugins
collections_path       = ./collections:~/.ansible/collections:/usr/share/ansible/collections
forks                  = 20
gather_facts           = False
retry_files_enabled    = False
callback_result_format = yaml
interpreter_python     = auto_silent
# Equipamentos de rede novos costumam não estar no known_hosts.
# Em produção, prefira True e mantenha o known_hosts do AWX/servidor de automação.
host_key_checking      = False

[persistent_connection]
# display current-configuration / show running-config podem ser longos
connect_timeout = 30
command_timeout = 120
